<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Календарь вахт</title>
<style>
:root{
  --bg:#f3f6fc;--card:#ffffff;--line:#e4e9f3;--text:#0e1a33;--muted:#6a7690;
  --blue:#3b82f6;--field:#ffffff;
  --w-bg:linear-gradient(160deg,#cfe1fd,#b4d0fb);--w-fg:#0f2a5c;--w-dot:#3b82f6;
  --r-bg:linear-gradient(160deg,#fbd5ae,#f7bc86);--r-fg:#5a2d05;--r-dot:#ea7a1c;
  --o-bg:#eef1f7;
  --shadow:0 2px 10px rgba(30,50,100,.06);
}
:root[data-theme="dark"]{
  --bg:#0d111b;--card:#171d2b;--line:#262e42;--text:#eef2fb;--muted:#8d98b3;
  --field:#1d2434;
  --w-bg:linear-gradient(160deg,#3f86f7,#2563d9);--w-fg:#ffffff;--w-dot:#b3d0ff;
  --r-bg:linear-gradient(160deg,#f7a64f,#ee8a2f);--r-fg:#2a1300;--r-dot:#7a3a00;
  --o-bg:#1d2434;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:background .25s,color .25s;
}
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:50%;flex:none;display:block}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{
  width:46px;height:46px;border-radius:14px;border:1px solid var(--line);flex:none;
  background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;
}
.gear:active{transform:scale(.95)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:19px;font-weight:700}

/* ---------- Форма ---------- */
.f3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin-bottom:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
.fld input,.fld select{
  width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--field);
  color:var(--text);font-size:16px;padding:0 12px;outline:none;font-family:inherit;min-width:0;
}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
input[type=date],input[type=time]{color-scheme:light}
:root[data-theme="dark"] input[type=date],:root[data-theme="dark"] input[type=time]{color-scheme:dark}
.apply{
  width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(180deg,#4b8dfa,#2f78f2);
  color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
.apply:active{transform:scale(.985)}
.error{color:#ef5350;font-size:14px;margin:0 0 10px;display:none}

/* ---------- Календарь ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav .title{font-size:21px;font-weight:700}
.nb{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--o-bg);border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:14px;color:var(--text);font-weight:500;margin-bottom:8px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.t{
  height:50px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:17px;font-weight:600;background:var(--o-bg);color:var(--text);
  font-variant-numeric:tabular-nums;position:relative;
}
.t i{width:5px;height:5px;border-radius:50%;background:transparent;display:block}
.t.work{background:var(--w-bg);color:var(--w-fg)}
.t.work i{background:var(--w-dot)}
.t.rest{background:var(--r-bg);color:var(--r-fg)}
.t.rest i{background:var(--r-dot)}
.t.out{opacity:.42}
.t.today{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}

/* мигание даты следующей смены */
@keyframes blink{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 transparent}
  50%{transform:scale(1.16);box-shadow:0 0 0 4px var(--glow),0 0 20px 8px var(--glow)}
}
.t.blink{animation:blink .75s ease-in-out 5;z-index:2;opacity:1}
.t.blink.work{--glow:rgba(59,130,246,.85)}
.t.blink.rest{--glow:rgba(255,140,30,.9)}

.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);margin-top:14px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.legend b{display:inline-block;width:20px;height:20px;border-radius:7px}
.legend .lw{background:var(--blue)}
.legend .lr{background:#f6a45a}
.legend .lt{border-radius:50%;border:2px solid var(--blue);box-shadow:inset 0 0 0 3px var(--card)}

.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--o-bg);border-radius:16px;padding:8px 5px 9px;cursor:pointer;min-width:0}
.mini:active{transform:scale(.97)}
.mini h4{margin:0 0 5px;text-align:center;font-size:14px;font-weight:700}
.mini .mw,.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .mw{font-size:9px;color:var(--muted);margin-bottom:3px}
.mini .t{height:19px;font-size:10px;border-radius:6px;gap:0;background:transparent}
.mini .t i{display:none}
.mini .t.work{background:var(--w-bg)}
.mini .t.rest{background:var(--r-bg)}
.mini .t.today{box-shadow:0 0 0 1.5px var(--blue)}

/* ---------- Карточки-инфо ---------- */
.row-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row-card .ic{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:rgba(59,130,246,.12);color:var(--blue);flex:none;
}
.rc-m{flex:1;min-width:0}
.rc-m b{display:block;font-size:16px}
.rc-m span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.rc-r{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);line-height:1.25}
.go{cursor:pointer}
.go:active{transform:scale(.99)}
.go svg.chev{color:var(--muted);flex:none}
.note{color:var(--muted);text-align:center;font-size:15px}

/* ---------- Окна (настройки, о программе) ---------- */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(5,10,25,.55)}
.ov.on{display:flex}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);
  border-radius:26px 26px 0 0;padding:18px 16px 28px;animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh-h h2{margin:0;font-size:22px}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);display:grid;place-items:center;cursor:pointer}
.sec{margin-bottom:20px}
.sec h3{margin:0 0 8px 2px;font-size:14px;color:var(--muted);font-weight:600}
.opts{display:grid;gap:8px}
.opt{
  display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-weight:600;
  cursor:pointer;font-family:inherit;text-align:left;width:100%;
}
.opt.on{border-color:var(--blue);background:rgba(59,130,246,.12)}
.opt .ck{margin-left:auto;color:var(--blue);display:none}
.opt.on .ck{display:block}
.flag{width:32px;height:22px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:block}
.globe{width:32px;height:22px;display:grid;place-items:center;flex:none;color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 .opt{justify-content:center;padding:0 6px;font-size:15px;height:48px;text-align:center}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.45}
.aboutbtn{
  width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--text);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.about-top{text-align:center;margin:4px 0 14px}
.about-top img{width:112px;height:112px;border-radius:50%;display:block;margin:0 auto 10px}
.about-top b{display:block;font-size:22px}
.about-top span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.about-p{color:var(--muted);line-height:1.55;font-size:15px;margin:0 0 12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" alt="">
      <h1 data-i="app">Календарь Вахт</h1>
    </div>
    <button class="gear" id="gearBtn" aria-label="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="card">
      <h2 data-i="setup">Настройка графика</h2>
      <div class="f3">
        <div class="fld"><label for="start" data-i="start">Начало вахты</label><input type="date" id="start"></div>
        <div class="fld"><label for="work" data-i="wd">Дней вахты</label><input type="number" id="work" min="1" max="365" inputmode="numeric"></div>
        <div class="fld"><label for="rest" data-i="rd">Дней отдыха</label><input type="number" id="rest" min="1" max="365" inputmode="numeric"></div>
      </div>
      <div class="f2">
        <div class="fld"><label for="ws" data-i="ws">Начало рабочего дня</label><input type="time" id="ws"></div>
        <div class="fld"><label for="we" data-i="we">Конец рабочего дня</label><input type="time" id="we"></div>
      </div>
      <div class="error" id="err"></div>
      <button class="apply" id="apply"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i="apply">Применить график</span></button>
    </section>

    <section class="card" id="calCard">
      <div class="seg"><button id="segM" data-i="month">Месяц</button><button id="segY" data-i="year">Год</button></div>
      <div class="nav">
        <button class="nb" id="prev" aria-label="prev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="title" id="calTitle"></div>
        <button class="nb" id="next" aria-label="next"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div id="cal"></div>
      <div class="legend"><span><b class="lw"></b><em style="font-style:normal" data-i="lw">Вахта</em></span><span><b class="lr"></b><em style="font-style:normal" data-i="lr">Отдых</em></span><span><b class="lt"></b><em style="font-style:normal" data-i="lt">Сегодня</em></span></div>
    </section>

    <div id="info"></div>
  </main>
</div>

<!-- Настройки -->
<div class="ov" id="ovSet">
  <div class="sheet" role="dialog">
    <div class="sh-h">
      <h2 data-i="settings">Настройки</h2>
      <button class="x" id="xSet" aria-label="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sec"><h3 data-i="language">Язык</h3><div class="opts" id="langOpts"></div></div>
    <div class="sec"><h3 data-i="theme">Тема</h3><div class="seg3" id="themeOpts"></div></div>
    <div class="sec">
      <h3 data-i="widgetRefresh">Частота обновления виджета</h3>
      <div class="fld"><select id="intSel"></select></div>
      <p class="hint" data-i="refreshHint"></p>
    </div>
    <button class="aboutbtn" id="openAbout"><span data-i="about">О программе</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<!-- О программе -->
<div class="ov" id="ovAbout">
  <div class="sheet" role="dialog">
    <div class="sh-h">
      <h2 data-i="about">О программе</h2>
      <button class="x" id="xAbout" aria-label="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="about-top">
      <img src="logo.png" alt="">
      <b>Вахтовик</b>
      <span data-i="tagline">Календарь смен и отдыха</span>
    </div>
    <p class="about-p" data-i="aboutP"></p>
    <p class="about-p" data-i="aboutW"></p>
    <p class="about-p"><span data-i="version">Версия</span> 1.1</p>
  </div>
</div>

    days:["день","дні","днів"],
    months:["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"],
    mshort:["Січ","Лют","Бер","Кві","Тра","Чер","Лип","Сер","Вер","Жов","Лис","Гру"],
    wdays:["Пн","Вт","Ср","Чт","Пт","Сб","Нд"]
  }
};
const INTERVALS=[1,5,10,15,30,60];
const DEFAULT_INTERVAL=10;
const KEY="vakhtCalendar.v2";
const now0=new Date();
let S={start:"",work:0,rest:0,ws:"",we:"",view:"month",year:now0.getFullYear(),month:now0.getMonth(),
  theme:"auto",lang:"auto",interval:DEFAULT_INTERVAL};
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r)Object.assign(S,r)}catch(e){}
if(["auto","light","dark"].indexOf(S.theme)<0)S.theme="auto";
if(INTERVALS.indexOf(S.interval)<0)S.interval=DEFAULT_INTERVAL;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
function curLang(){
  if(S.lang==="ru"||S.lang==="uk")return S.lang;
  const l=(navigator.language||"ru").toLowerCase();
  return l.indexOf("uk")===0?"uk":"ru";
}
const T=()=>I18N[curLang()];
const dayNum=(y,m,d)=>Math.floor(Date.UTC(y,m,d)/864e5);
function parseISO(s){const p=(s||"").split("-").map(Number);return p.length===3&&p[0]?{y:p[0],m:p[1]-1,d:p[2]}:null}
const f2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+f2(d.getMonth()+1)+"-"+f2(d.getDate());
const fmtDate=d=>f2(d.getDate())+"."+f2(d.getMonth()+1)+"."+d.getFullYear();
function pl(n,f){const m=n%100,k=n%10;if(m>10&&m<20)return f[2];if(k===1)return f[0];if(k>1&&k<5)return f[1];return f[2]}
const toMin=v=>(v&&/^\d\d:\d\d/.test(v))?parseInt(v.slice(0,2),10)*60+parseInt(v.slice(3,5),10):-1;

function cfgOk(){return !!parseISO(S.start)&&S.work>0&&S.rest>0}
function pos(y,m,d){
  const s=parseISO(S.start),cycle=S.work+S.rest;
  const idx=dayNum(y,m,d)-dayNum(s.y,s.m,s.d);
  return ((idx%cycle)+cycle)%cycle;
}
const isWork=(y,m,d)=>cfgOk()&&pos(y,m,d)<S.work;

/* ---------- Связь с Android ---------- */
function sendToApp(){
  try{if(window.Android&&cfgOk())Android.saveSchedule(S.start,S.work,S.rest,toMin(S.ws),toMin(S.we))}catch(e){}
}
function sendPrefs(){
  try{if(window.Android)Android.setPrefs(S.lang,S.interval)}catch(e){}
}

/* ---------- Тема ---------- */
function sysDark(){
  try{if(window.Android&&typeof Android.isSystemDark==="function")return !!Android.isSystemDark()}catch(e){}
  return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(){
  const th=S.theme==="auto"?(sysDark()?"dark":"light"):S.theme;
  document.documentElement.dataset.theme=th;
  try{if(window.Android)Android.setTheme(th==="dark")}catch(e){}
}

/* ---------- Тексты ---------- */
function applyLang(){
  const t=T();
  document.documentElement.lang=curLang();
  document.querySelectorAll("[data-i]").forEach(el=>{const k=el.getAttribute("data-i");if(t[k]!==undefined)el.textContent=t[k]});
  renderSettings();
}

/* ---------- Календарь ---------- */
function tile(d,inMonth,ty,tm,td){
  const y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
  let c="t";
  if(cfgOk())c+=isWork(y,m,n)?" work":" rest";
  if(!inMonth)c+=" out";
  if(y===ty&&m===tm&&n===td)c+=" today";
  return '<div class="'+c+'" data-date="'+iso(d)+'">'+n+'<i></i></div>';
}
function renderCal(){
  const t=T(),box=$("cal"),now=new Date(),ty=now.getFullYear(),tm=now.getMonth(),td=now.getDate();
  $("segM").classList.toggle("on",S.view==="month");
  $("segY").classList.toggle("on",S.view==="year");
  let h="";
  if(S.view==="month"){
    $("calTitle").textContent=t.months[S.month]+" "+S.year;
    h='<div class="wk">'+t.wdays.map(x=>'<span>'+x+'</span>').join("")+'</div><div class="grid7">';
    const first=(new Date(S.year,S.month,1).getDay()+6)%7;
    for(let i=0;i<42;i++){
      const d=new Date(S.year,S.month,1-first+i);
      h+=tile(d,d.getMonth()===S.month,ty,tm,td);
    }
    h+='</div>';
  }else{
    $("calTitle").textContent=S.year;
    h='<div class="yr">';
    for(let m=0;m<12;m++){
      const first=(new Date(S.year,m,1).getDay()+6)%7,dim=new Date(S.year,m+1,0).getDate();
      h+='<div class="mini" data-m="'+m+'"><h4>'+t.mshort[m]+'</h4><div class="mw">'+t.wdays.map(x=>'<span>'+x.charAt(0)+'</span>').join("")+'</div><div class="mg">';
      for(let i=0;i<first;i++)h+='<div></div>';
      for(let d=1;d<=dim;d++)h+=tile(new Date(S.year,m,d),true,ty,tm,td);
      h+='</div></div>';
    }
    h+='</div>';
  }
  box.innerHTML=h;
}

const ICON_CAL='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M12 14h2M8 18h2M12 18h2"/></svg>';
const ICON_CLOCK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const ICON_CHEV='<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

function renderInfo(){
  const t=T(),el=$("info");
  if(!cfgOk()){el.innerHTML='<div class="card note">'+t.noCfg+'</div>';return}
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
  const p=pos(y,m,n),working=p<S.work,cycle=S.work+S.rest;
  const x=working?p+1:p-S.work+1,tot=working?S.work:S.rest;
  const left=working?S.work-p:cycle-p;
  const nd=new Date(y,m,n+left);
  const C=2*Math.PI*18,frac=Math.min(1,x/tot);
  const hrs=(toMin(S.ws)>=0&&toMin(S.we)>=0)?'<span>'+t.shift+': '+S.ws+' – '+S.we+'</span>':'';
  const ring='<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'" transform="rotate(-90 23 23)"/></svg>';
  const dayOf=t.dayOf.replace("{x}",x).replace("{n}",tot).split("|").join("<br>");
  el.innerHTML=
    '<div class="card row-card"><div class="ic">'+ICON_CAL+'</div><div class="rc-m"><b>'+t.cycle+'</b><span>'+S.work+' '+pl(S.work,t.days)+' '+t.wl+' / '+S.rest+' '+pl(S.rest,t.days)+' '+t.rl+'</span>'+hrs+'</div><div class="rc-r">'+ring+'<div>'+dayOf+'</div></div></div>'+
    '<div class="card row-card go" id="goNext" data-date="'+iso(nd)+'" data-y="'+nd.getFullYear()+'" data-m="'+nd.getMonth()+'"><div class="ic">'+ICON_CLOCK+'</div><div class="rc-m"><b>'+t.next+'</b><span>'+fmtDate(nd)+' ('+(working?t.nextRest:t.nextWork)+')</span></div>'+ICON_CHEV+'</div>';
}

/* ---------- Настройки ---------- */
function renderSettings(){
  const t=T();
  const lang=[["auto",GLOBE,t.langAuto],["ru",FLAG_RU,"Русский"],["uk",FLAG_UK,"Українська"]];
  $("langOpts").innerHTML=lang.map(l=>'<button class="opt'+(S.lang===l[0]?" on":"")+'" data-lang="'+l[0]+'">'+l[1]+'<span>'+l[2]+'</span>'+CHECK+'</button>').join("");
  const th=[["auto",t.themeAuto],["light",t.themeLight],["dark",t.themeDark]];
  $("themeOpts").innerHTML=th.map(o=>'<button class="opt'+(S.theme===o[0]?" on":"")+'" data-theme="'+o[0]+'"><span>'+o[1]+'</span></button>').join("");
  $("intSel").innerHTML=INTERVALS.map(n=>'<option value="'+n+'"'+(S.interval===n?" selected":"")+'>'+n+' '+t.min+(n===DEFAULT_INTERVAL?' ('+t.def+')':'')+'</option>').join("");
}

function render(){applyLang();renderCal();renderInfo()}

/* ---------- Окна ---------- */
function openOv(id){$(id).classList.add("on")}
function closeOv(id){$(id).classList.remove("on")}
window.closeTop=function(){
  if($("ovAbout").classList.contains("on")){closeOv("ovAbout");return true}
  if($("ovSet").classList.contains("on")){closeOv("ovSet");return true}
  return false;
};
$("gearBtn").onclick=()=>openOv("ovSet");
$("xSet").onclick=()=>closeOv("ovSet");
$("xAbout").onclick=()=>closeOv("ovAbout");
$("openAbout").onclick=()=>openOv("ovAbout");
["ovSet","ovAbout"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target===$(id))closeOv(id)}));

$("langOpts").addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]");if(!b)return;
  S.lang=b.dataset.lang;save();sendPrefs();render();
});
$("themeOpts").addEventListener("click",e=>{
  const b=e.target.closest("[data-theme]");if(!b)return;
  S.theme=b.dataset.theme;save();applyTheme();renderSettings();
});
$("intSel").onchange=e=>{S.interval=parseInt(e.target.value,10);save();sendPrefs()};

/* ---------- События ---------- */
$("apply").onclick=()=>{
  const s=$("start").value,w=parseInt($("work").value,10),r=parseInt($("rest").value,10);
  const ws=$("ws").value,we=$("we").value,t=T(),err=$("err");
  if(!s||!(w>0)||!(r>0)){err.textContent=t.err;err.style.display="block";return}
  if((ws&&!we)||(!ws&&we)){err.textContent=t.errT;err.style.display="block";return}
  err.style.display="none";
  S.start=s;S.work=w;S.rest=r;S.ws=ws;S.we=we;
  const p=parseISO(s);S.year=p.y;S.month=p.m;
  save();render();sendToApp();
};
$("segM").onclick=()=>{S.view="month";save();render()};
$("segY").onclick=()=>{S.view="year";save();render()};
function step(n){
  if(S.view==="year")S.year+=n;
  else{S.month+=n;if(S.month<0){S.month=11;S.year--}if(S.month>11){S.month=0;S.year++}}
  save();render();
}
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);

// тап по месяцу в режиме «Год» открывает этот месяц
$("cal").addEventListener("click",e=>{
  if(S.view!=="year")return;
  const el=e.target.closest(".mini");
  if(!el)return;
  S.month=parseInt(el.dataset.m,10);S.view="month";
  save();render();$("calCard").scrollIntoView({behavior:"smooth",block:"start"});
});

// мигание даты
function blinkDate(dateIso){
  const tile=document.querySelector('#cal .t[data-date="'+dateIso+'"]');
  if(!tile)return;
  tile.classList.remove("blink");
  void tile.offsetWidth;
  tile.classList.add("blink");
  setTimeout(()=>tile.classList.remove("blink"),4300);
}
// тап по «Следующая смена»: открыть месяц этой даты и помигать ею
$("info").addEventListener("click",e=>{
  const el=e.target.closest("#goNext");
  if(!el)return;
  const dateIso=el.dataset.date;
  S.year=parseInt(el.dataset.y,10);S.month=parseInt(el.dataset.m,10);S.view="month";
  save();render();
  $("calCard").scrollIntoView({behavior:"smooth",block:"start"});
  setTimeout(()=>blinkDate(dateIso),450);
});

document.addEventListener("visibilitychange",()=>{if(!document.hidden){applyTheme();renderCal();renderInfo()}});

// старт
$("start").value=S.start||"";
$("work").value=S.work||"";
$("rest").value=S.rest||"";
$("ws").value=S.ws||"";
$("we").value=S.we||"";
applyTheme();render();sendPrefs();sendToApp();
</script>
</body>
</html>
